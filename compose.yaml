name: akson
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akson
      POSTGRES_USER: akson
      POSTGRES_PASSWORD: akson
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akson -d akson"]
      interval: 10s
      start_interval: 1s
      start_period: 5s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api
    develop:
      watch:
        - path: ./api
          action: rebuild
          ignore:
            - chats/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      start_interval: 1s
      start_period: 5s
      timeout: 5s
      retries: 3
    ports:
      - ${AKSON_API_PORT}:8000
    volumes:
      - ./api/chats:/root/chats
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ALLOW_ORIGINS=${AKSON_WEB_EXTERNAL_URL}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=akson
      - DB_PASSWORD=akson
      - DB_NAME=akson
      - DB_SSLMODE=disable
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    develop:
      watch:
        - path: ./web
          action: sync
          target: /app
          ignore:
            - node_modules/
        - path: ./askon-web/package.json
          action: rebuild
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${AKSON_WEB_PORT}:5173
    environment:
      - VITE_API_BASE_URL=${AKSON_API_EXTERNAL_URL}

  cli:
    build:
      context: ./
      dockerfile: ./cli/Dockerfile
    profiles:
      - cli
    depends_on:
      api:
        condition: service_healthy
    environment:
      - AKSON_API_BASE_URL=http://api:8000

  telegram-bot:
    build:
      context: ./
      dockerfile: ./telegram-bot/Dockerfile
    profiles:
      - telegram
    develop:
      watch:
        - path: ./telegram-bot
          action: sync+restart
          target: /app
          ignore:
            - .venv/
        - path: ./telegram-bot/pyproject.toml
          action: rebuild
    depends_on:
      api:
        condition: service_healthy
    # TODO Save chat ID
    # volumes:
    #   - ./api/chats:/app/chats
    environment:
      - AKSON_API_BASE_URL=http://api:8000
    env_file:
      - ./telegram-bot/.env

volumes:
  postgres_data:
